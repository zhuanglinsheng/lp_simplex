name: Windows validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: build-vcpkg-installed
          key: windows-x64-vcpkg-${{ hashFiles('vcpkg.json') }}
      - name: Install pinned numerical dependencies
        shell: pwsh
        run: ./tools/install_dependencies.ps1
      - name: Install test dependencies and prepare data
        shell: pwsh
        run: |
          python -m pip install numpy scipy
          python data/netlib/prepare.py --all
      - name: Build and test native MSVC DLL
        shell: pwsh
        run: ./tools/build.ps1
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: |
            build-windows/Testing/Temporary/*.log
            build-vcpkg/buildtrees/**/*.log
          if-no-files-found: warn
