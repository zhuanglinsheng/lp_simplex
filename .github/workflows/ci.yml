name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  style:
    name: Source formatting and script whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned formatters
        run: python -m pip install "clang-format==$(cat .clang-format-version)" "cmakelang==$(cat .cmake-format-version)"
      - name: Check formatting and file headers
        run: python tools/check_style.py
      - name: Check source ownership boundaries
        run: python tools/check_architecture.py
      - name: Check documentation links
        run: python tools/check_docs.py

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential \
            libopenblas-dev liblapack-dev libsuitesparse-dev libgmp-dev python3-numpy

      - name: Prepare test data
        run: |
          python3 data/netlib/prepare.py --all
          python3 test/test_prepare_data.py

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLP_SIMPLEX_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      # The Debug configuration already carries -fsanitize=address.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure

  no-suite-sparse:
    name: build without SuiteSparse (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential libopenblas-dev liblapack-dev python3-numpy

      - name: Prepare test data
        run: |
          python3 data/netlib/prepare.py --all
          python3 test/test_prepare_data.py

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLP_SIMPLEX_USE_KLU=OFF \
            -DLP_SIMPLEX_USE_SPQR=OFF

      - name: Build and test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          cmake --build build -j "$(nproc)"
          ctest --test-dir build --output-on-failure

  macos-package:
    name: macOS release package relocation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C API package with system numerical libraries
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DLP_SIMPLEX_USE_KLU=OFF -DLP_SIMPLEX_USE_SPQR=OFF \
            -DLP_SIMPLEX_USE_GMP=OFF -DLP_SIMPLEX_BUILD_BENCHMARKS=OFF \
            -DLP_SIMPLEX_BUILD_EXAMPLES=OFF
      - name: Build and verify relocated C and C++ consumers
        run: |
          cmake --build build -j 3
          ctest --test-dir build -R '^test_install_package$' --output-on-failure
