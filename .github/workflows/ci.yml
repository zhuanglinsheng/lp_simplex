name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential \
            libopenblas-dev liblapack-dev libsuitesparse-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLP_SIMPLEX_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      # The Debug configuration already carries -fsanitize=address.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure

  no-suite-sparse:
    name: build without SuiteSparse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential libopenblas-dev liblapack-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLP_SIMPLEX_USE_KLU=OFF \
            -DLP_SIMPLEX_USE_SPQR=OFF

      - name: Build and test
        run: |
          cmake --build build -j "$(nproc)"
          ctest --test-dir build --output-on-failure
